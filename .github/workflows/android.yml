name: Build NEXUS APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
            test -s "$RUNNER_TEMP/nexus-release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/nexus-release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Chiave di firma caricata: build release firmata"
          else
            echo "::warning::Segreti di firma assenti: compilo debug e pubblico una release chiaramente etichettata DEBUG."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon assembleDebug

      - name: Read launcher version
        id: version
        run: |
          set -e
          VERSION=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        id: apk
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME="Nexus-${VERSION}.apk"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME="Nexus-${VERSION}-debug.apk"
          fi
          test -f "$SRC"
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK raccolto: dist/$NAME"
          cat "dist/$NAME.sha256"

      - name: Verify release signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APK="dist/${{ steps.apk.outputs.name }}"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application:" || true
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::L'APK release risulta debuggable"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish release on GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK="${{ steps.apk.outputs.name }}"
          ASSET="dist/${APK}"
          SUM="${ASSET}.sha256"
          SIGNED="${{ steps.signing.outputs.ready }}"

          if [ "$SIGNED" = "true" ]; then
            TITLE="Nexus $VERSION"
            STATE="Build **release firmata con la chiave di release** del repository."
            SIGNING="Firma: APK release firmato; gli aggiornamenti futuri firmati con la stessa chiave si installano sopra questa versione."
          else
            TITLE="Nexus $VERSION (DEBUG build)"
            STATE="**ATTENZIONE: questa e una build DEBUG, non firmata con la chiave di release.** Non usarla come base per aggiornamenti in produzione: serve solo per provare la nuova interfaccia."
            SIGNING="Firma: debug keystore generato dal runner CI. I segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD non sono configurati."
          fi

          NOTES=$(cat <<EOF
          $STATE

          ## Novita di Nexus 1.3
          - nuova sezione **Informazioni sul dispositivo** in stile realme UI, con schede arrotondate e icone colorate
          - dispositivo: nome commerciale, produttore, modello, nome dispositivo, Android, API, build e patch di sicurezza
          - hardware: processore, architettura, core, RAM totale e disponibile, memoria interna, risoluzione, densita e frequenza di aggiornamento
          - batteria: percentuale, stato di carica, alimentazione, temperatura e tecnologia
          - dati Nexus: versione, version code, modalita attiva, tipo di build e repository
          - pulsanti Aggiorna e Copia dettagli; le voci non disponibili sono dichiarate, mai simulate
          - fluidita: le pagine della home vengono costruite solo quando servono, il cassetto e precompilato e la ricerca e filtrata con debounce
          - avvio delle app piu rapido con intent in cache, sfondo decodificato fuori dal thread principale e aggiornamenti dei widget senza lavoro ripetuto
          - Nexus Lite ancora piu leggero: nessuna ombra sulle etichette e rendering essenziale
          - restano tutte le funzioni precedenti: tema, accento, icone, pagine, dock, cartelle, widget, backup e ripristino

          Installazione: scarica l'APK sul telefono, consenti l'installazione da origini sconosciute e aprilo. Richiede Android 10 (API 29) o successivo.

          $SIGNING

          Checksum SHA-256 incluso nell'asset \`${APK}.sha256\`.
          EOF
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG esistente: aggiorno gli asset"
            gh release upload "$TAG" "$ASSET" "$SUM" --clobber
          else
            gh release create "$TAG" "$ASSET" "$SUM" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

          for stale in "Nexus-${VERSION}.apk" "Nexus-${VERSION}-debug.apk"; do
            if [ "$stale" != "$APK" ]; then
              gh release delete-asset "$TAG" "$stale" --yes > /dev/null 2>&1 || true
            fi
          done

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
