name: Build NEXUS APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager non presente, uso i componenti gia installati"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Read launcher version
        id: version
        run: |
          set -e
          VERSION=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish downloadable GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK="Nexus-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"

          NOTES=$(cat <<'EOF'
          APK debug di Nexus, il launcher Android in Java con estetica Pixel e dettagli iOS.

          Cosa contiene:
          - pagine home multiple scorrevoli, con pagina centrale predefinita
          - drag and drop delle icone tra posizioni e pagine, con salvataggio automatico
          - cartelle: creazione trascinando un'icona su un'altra, rinomina, aggiunta e rimozione app
          - widget reali tramite AppWidgetHost: scelta, configurazione, ridimensionamento e rimozione
          - cassetto app in ordine alfabetico con ricerca in tempo reale
          - griglia e icone personalizzabili, temi chiaro/scuro, sfondo, dock
          - modalita Nexus e Nexus Lite nello stesso APK
          - persistenza di pagine, posizioni, cartelle, widget, dock e preferenze

          Installazione: scarica l'APK sul telefono, consenti l'installazione da origini sconosciute
          per il browser o il file manager e aprilo. Richiede Android 10 (API 29) o successivo.
          Dopo l'installazione puoi impostare Nexus come launcher predefinito dalle impostazioni.

          Nota: build debug, firmata con la chiave di debug; non e una build di produzione.
          EOF
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG esistente: aggiorno l'APK"
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Creo la release $TAG"
            gh release create "$TAG" "$APK" \
              --title "Nexus $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

          echo "Asset pubblicato: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
